name: Android build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Configure Android signing
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_SIGNING_KEY_BASE64" ] || \
             [ -z "$ANDROID_SIGNING_STORE_PASSWORD" ] || \
             [ -z "$ANDROID_SIGNING_KEY_ALIAS" ] || \
             [ -z "$ANDROID_SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Configure all four Android signing repository secrets before building."
            exit 1
          fi
          echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/zrscanner-signing-key.jks"
          chmod 600 "$RUNNER_TEMP/zrscanner-signing-key.jks"

      - name: Build signed APK
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >-
          dotnet publish src/ZRScanner.Mobile/ZRScanner.Mobile.csproj
          -f net10.0-android -c Release -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/zrscanner-signing-key.jks"
          -p:AndroidSigningKeyAlias="$ANDROID_SIGNING_KEY_ALIAS"
          -p:AndroidSigningKeyPass="$ANDROID_SIGNING_KEY_PASSWORD"
          -p:AndroidSigningStorePass="$ANDROID_SIGNING_STORE_PASSWORD"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ZRScanner-Android-APK
          path: src/ZRScanner.Mobile/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed AAB
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: >-
          dotnet publish src/ZRScanner.Mobile/ZRScanner.Mobile.csproj
          -f net10.0-android -c Release -p:AndroidPackageFormats=aab
          -p:AndroidKeyStore=true
          -p:AndroidSigningKeyStore="$RUNNER_TEMP/zrscanner-signing-key.jks"
          -p:AndroidSigningKeyAlias="$ANDROID_SIGNING_KEY_ALIAS"
          -p:AndroidSigningKeyPass="$ANDROID_SIGNING_KEY_PASSWORD"
          -p:AndroidSigningStorePass="$ANDROID_SIGNING_STORE_PASSWORD"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ZRScanner-Android-AAB
          path: src/ZRScanner.Mobile/bin/Release/net10.0-android/publish/*.aab
          if-no-files-found: error
          retention-days: 14
