name: Android build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android
      - name: Configure Android signing
        id: signing
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_SIGNING_KEY_BASE64" ] && [ -n "$ANDROID_SIGNING_PASSWORD" ] && [ -n "$ANDROID_SIGNING_KEY_ALIAS" ]; then
            echo "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/zrscanner-signing-key.jks"
            echo "configuration=Release" >> "$GITHUB_OUTPUT"
            echo "Using the configured stable signing key."
          elif [ -z "$ANDROID_SIGNING_KEY_BASE64" ] && [ -z "$ANDROID_SIGNING_PASSWORD" ] && [ -z "$ANDROID_SIGNING_KEY_ALIAS" ]; then
            echo "configuration=Debug" >> "$GITHUB_OUTPUT"
            echo "Stable signing secrets are not configured; creating a debug-signed test APK."
          else
            echo "::error::Configure all three secrets together: ANDROID_SIGNING_KEY_BASE64, ANDROID_SIGNING_PASSWORD, ANDROID_SIGNING_KEY_ALIAS."
            exit 1
          fi
      - name: Build Android APK
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          BUILD_CONFIGURATION: ${{ steps.signing.outputs.configuration }}
        run: |
          if [ "$BUILD_CONFIGURATION" = "Release" ]; then
            dotnet publish src/ZRScanner.Mobile/ZRScanner.Mobile.csproj \
              -f net10.0-android -c Release -p:AndroidPackageFormats=apk \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore="$RUNNER_TEMP/zrscanner-signing-key.jks" \
              -p:AndroidSigningKeyAlias="$ANDROID_SIGNING_KEY_ALIAS" \
              -p:AndroidSigningKeyPass="$ANDROID_SIGNING_PASSWORD" \
              -p:AndroidSigningStorePass="$ANDROID_SIGNING_PASSWORD"
          else
            dotnet publish src/ZRScanner.Mobile/ZRScanner.Mobile.csproj \
              -f net10.0-android -c Debug -p:AndroidPackageFormats=apk
          fi
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZRScanner-Android-APK
          path: src/ZRScanner.Mobile/bin/*/net10.0-android/publish/*.apk
          if-no-files-found: error
          retention-days: 14
